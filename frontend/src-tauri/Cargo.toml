[package]
name = "wbmusic"
version = "0.1.2"
description = "WBMusic - 跨平台音乐播放器"
authors = ["WBMusic"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "wbmusic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

# 网络请求（调用第三方音乐 API）
reqwest = { version = "0.12", features = ["json", "cookies"] }
tokio = { version = "1", features = ["full"] }

# 歌词 base64 解码
base64 = "0.22"

# 环境变量 (.env)
dotenvy = "0.15"

# 系统凭据库（Windows Credential Manager / macOS Keychain / Linux Secret Service）
# 用于安全存储登录凭据（Cookie），避免明文落盘
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"

